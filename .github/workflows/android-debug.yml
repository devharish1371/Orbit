name: Android debug test build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            web/android/**/*.gradle
            web/android/gradle/wrapper/gradle-wrapper.properties
      - name: Validate public client configuration
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const url = process.env.VITE_SUPABASE_URL;
          const key = process.env.VITE_SUPABASE_ANON_KEY ?? '';
          let valid = /^sb_publishable_/.test(key);
          if (key.startsWith('eyJ')) {
            try { valid = JSON.parse(Buffer.from(key.split('.')[1], 'base64url').toString()).role === 'anon'; } catch { valid = false; }
          }
          if (!url?.startsWith('https://') || !valid) throw new Error('Configure only the project URL and public client key in repository variables.');
          JS
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run check:web
      - name: Check Python tools and scan source
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r tools/requirements.lock.txt
          .venv/bin/python -m pytest --tb=short
          .venv/bin/python tools/secret_scan.py
      - run: npm --prefix web run cap:sync
      - name: Configure private Firebase Android app
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_B64"
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > web/android/app/google-services.json
          chmod 600 web/android/app/google-services.json
      - name: Prepare stable debug signing
        env:
          DEBUG_KEY_B64: ${{ secrets.ORBIT_DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$DEBUG_KEY_B64"
          printf '%s' "$DEBUG_KEY_B64" | base64 --decode > "$RUNNER_TEMP/orbit-debug.p12"
          chmod 600 "$RUNNER_TEMP/orbit-debug.p12"
      - name: Build installable debug APK
        env:
          ORBIT_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/orbit-debug.p12
          ORBIT_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_DEBUG_KEYSTORE_PASSWORD }}
        working-directory: web/android
        run: |
          bash ./gradlew --no-daemon testDebugUnitTest assembleDebug
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          manifest="app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml"
          test -f "$manifest"
          python3 - "$manifest" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot(); a='{http://schemas.android.com/apk/res/android}'
          service=next(s for s in root.findall('./application/service') if s.get(a+'name')=='app.orbit.couple.OrbitTrackerService')
          assert service.get(a+'foregroundServiceType')=='location' and service.get(a+'exported')=='false' and service.get(a+'stopWithTask')=='false'
          print('Independent location foreground service verified in merged manifest.')
          push=next(s for s in root.findall('./application/service') if s.get(a+'name')=='com.capacitorjs.plugins.pushnotifications.MessagingService')
          assert any(action.get(a+'name')=='com.google.firebase.MESSAGING_EVENT' for action in push.findall('./intent-filter/action'))
          from pathlib import Path
          resources=list(Path('app/build/generated/res').rglob('values.xml'))
          assert any(any(s.get('name')=='google_app_id' and s.text for s in ET.parse(p).getroot().findall('string')) for p in resources)
          print('Firebase native configuration and messaging service verified.')
          permissions={p.get(a+'name') for p in root.findall('uses-permission')}
          assert {'android.permission.RECORD_AUDIO','android.permission.MODIFY_AUDIO_SETTINGS'} <= permissions
          activity=next(p for p in root.findall('./application/activity') if p.get(a+'name')=='app.orbit.couple.MainActivity')
          assert activity.get(a+'windowSoftInputMode')=='adjustResize'
          print('Foreground voice permissions and chat keyboard resize verified.')
          assert 'android.permission.USE_BIOMETRIC' in permissions
          from pathlib import Path
          assert 'PrivacyPlugin.class' in Path('app/src/main/java/app/orbit/couple/MainActivity.java').read_text()
          print('Native privacy bridge and biometric permission verified.')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: orbit-m8-debug
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
